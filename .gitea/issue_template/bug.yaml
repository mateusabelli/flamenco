name: Bug Report
about: File a bug report
labels:
  - "Type/Report"
  - "Status/Needs Triage"
  - "Priority/Normal"
body:
  - type: markdown
    attributes:
      value: |
        ### Instructions
        Wondering if you really found a bug? Or do you just need help?
        Come chat with us at [Blender Chat](https://chat.blender.org/#/room/#flamenco:blender.org).

        * Include your system information below.
        * If there are multiple bugs, make multiple bug reports.

        ### AI Policy

        Blender's [AI Contributions Policy](https://developer.blender.org/docs/handbook/contributing/ai_contributions/)
        also applies to this project.

        > [!IMPORTANT]
        > Bug reports should always be **written by a human**. Never use AI to generate these.
  - type: textarea
    id: body
    attributes:
      label: "Description"
      hide_label: true
      value: |
        **System Information**
        Operating System(s):

        **Flamenco Version**
        Is Broken:   <!-- the Flamenco version you have this issue with. -->
        Worked OK:   <!-- the version that still worked ok, if this worked before. -->

        **Short description of error**

        **Exact steps for others to reproduce the error**
        <!-- Include steps to reproduce the issue, and make sure you describe both what is happening and what you expected to happen. -->
